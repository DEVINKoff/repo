# XcodeGen spec — the CI workflow turns this into DevTest.xcodeproj on a Mac runner.
name: DevTest
options:
  bundleIdPrefix: com.devink
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  DevTest:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: DevTestWidgets
        embed: true
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devink.devtest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DevTest
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  DevTestWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devink.devtest.widgets
        SKIP_INSTALL: "YES"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: DevTest Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
