name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project DevTest.xcodeproj \
            -scheme DevTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/DevTest.app
          ls -la "$APP" "$APP/PlugIns"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry DevTest.ipa Payload
          ls -la DevTest.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DevTest-ipa
          path: out/DevTest.ipa
          if-no-files-found: error
